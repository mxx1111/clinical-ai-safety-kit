spring:
  application:
    name: clinical-ai-safety-kit
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

info:
  app:
    name: Clinical AI Safety Kit
    description: Safety evaluation gateway for medical AI applications
    version: 0.1.0
