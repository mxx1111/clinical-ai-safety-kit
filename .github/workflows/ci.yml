name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify project
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Test MONAI Deploy integration adapter
        run: python3 -m unittest discover -s integrations/monai-deploy/tests -p 'test_*.py'

      - name: Validate all committed receipts
        run: python3 scripts/verify_agent_receipt.py --all

      - name: Upload benchmark evidence and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-evidence-${{ github.sha }}
          path: |
            target/benchmark-results/synthetic-text-safety-v1.json
            target/benchmark-results/synthetic-text-safety-v1.md
            target/clinical-ai-safety-kit-sbom.json
          if-no-files-found: error
          retention-days: 30
