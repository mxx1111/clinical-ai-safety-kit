name: AI Contribution Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load the protected verifier from the base branch
        run: git show "origin/${{ github.base_ref }}:scripts/verify_agent_receipt.py" > "$RUNNER_TEMP/verify_agent_receipt.py"

      - name: Validate changed contribution receipt
        env:
          MEDAGENTGUARD_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/verify_agent_receipt.py" --base "origin/${{ github.base_ref }}"
