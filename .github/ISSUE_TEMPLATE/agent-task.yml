name: Agent task
description: Propose a scoped task for an AI agent
title: "[Agent Task]: "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Humans define the goal; AI agents implement, test, document, and review the change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or safety problem should be solved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective, testable outcomes.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Regression tests cover ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low
        - Medium
        - High — security, governance, or medical safety behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Synthetic data plan
      description: Explain which synthetic inputs can be used. Never submit PHI.
    validations:
      required: true
